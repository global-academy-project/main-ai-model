name: Docker Build Workflow

on:
  workflow_call:
    outputs:
      summary:
        description: Markdown summary of the Trivy image scans
        value: ${{ jobs.build_and_scan.outputs.summary }}

jobs:
    build_and_scan:
        runs-on: ubuntu-24.04
        outputs:
            summary: ${{ steps.report.outputs.summary }}
        env:
            IMAGE_TAG: sha-${{ github.sha }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7.0.1

            # Buildx는 tour-learn-collection/docker-and-kubernetes/example/server README.md에 해당 기능에 대해 설명되어 있지만 
            # 여기서는 GitHub Actions에서 Docker 이미지를 별도의 다양한 플랫폼에서 빌드하기 위해 사용된다.
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4.4.1
              with:
                install: true

            - name: Verify Docker Buildx
              run: |
                  docker buildx version
                  docker buildx inspect --bootstrap
            
            - name: Build Docker images
              run: |
                for target in ai embedding ingest; do
                  docker buildx build \
                    --target "$target" \
                    --tag "ci-${target}:${IMAGE_TAG}" \
                    --load .
                done

            - name: Scan AI image
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  scan-type: image
                  image-ref: ci-ai:${{ env.IMAGE_TAG }}
                  format: json
                  output: trivy-ai.json
                  exit-code: '0'

            - name: Scan embedding image
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  scan-type: image
                  image-ref: ci-embedding:${{ env.IMAGE_TAG }}
                  format: json
                  output: trivy-embedding.json
                  exit-code: '0'

            - name: Scan ingest image
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  scan-type: image
                  image-ref: ci-ingest:${{ env.IMAGE_TAG }}
                  format: json
                  output: trivy-ingest.json
                  exit-code: '0'

            - name: Build scan summary
              id: report
              shell: bash
              run: |
                  summary="$(jq -s '
                    [to_entries[] as $file
                     | $file.value.Results[]?.Vulnerabilities[]?
                     | . + {Image: ["ai", "embedding", "ingest"][$file.key]}] as $v
                    | "**검사 대상:** `ai`, `embedding`, `ingest` PR 이미지\n"
                      + "**취약점 수:** CRITICAL "
                      + ([$v[] | select(.Severity == "CRITICAL")] | length | tostring)
                      + ", HIGH "
                      + ([$v[] | select(.Severity == "HIGH")] | length | tostring)
                      + ", MEDIUM "
                      + ([$v[] | select(.Severity == "MEDIUM")] | length | tostring)
                      + ", LOW "
                      + ([$v[] | select(.Severity == "LOW")] | length | tostring)
                      + (if ($v | length) == 0 then
                           "\n\n취약점이 발견되지 않았습니다."
                         else
                           "\n\n**주요 항목 (최대 10개):**\n"
                           + ([$v | sort_by(
                                 if .Severity == "CRITICAL" then 0
                                 elif .Severity == "HIGH" then 1
                                 elif .Severity == "MEDIUM" then 2
                                 else 3
                                 end
                               ) | .[:10][]
                               | "- `" + (.VulnerabilityID // "unknown") + "` "
                                 + (.Severity // "UNKNOWN") + " | `"
                                 + (.Image // "unknown") + "` | `"
                                 + (.PkgName // "unknown") + "` "
                                 + (.InstalledVersion // "version unknown") + " -> "
                                 + (.FixedVersion // "수정 버전 없음")]
                              | join("\n"))
                         end)
                  ' trivy-ai.json trivy-embedding.json trivy-ingest.json)"
                  delimiter="trivy_$(openssl rand -hex 16)"
                  {
                    printf 'summary<<%s\n' "$delimiter"
                    printf '%s\n' "$summary"
                    printf '%s\n' "$delimiter"
                  } >> "$GITHUB_OUTPUT"