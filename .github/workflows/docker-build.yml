name: Docker Build Workflow

on:
  workflow_call:
    outputs:
      summary:
        description: Markdown summary of the Trivy image scans
        value: ${{ jobs.report.outputs.summary }}

jobs:
      build_and_scan:
        runs-on: ubuntu-24.04
        strategy:
          fail-fast: false
          matrix:
            target: [embedding, ingest]
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7.0.1

            # Buildx는 tour-learn-collection/docker-and-kubernetes/example/server README.md에 해당 기능에 대해 설명되어 있지만 
            # 여기서는 GitHub Actions에서 Docker 이미지를 별도의 다양한 플랫폼에서 빌드하기 위해 사용된다.
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4.4.1

            - name: Verify Docker Buildx
              run: |
                  docker buildx version
                  docker buildx inspect --bootstrap
            
            - name: Build Docker image
              run: |
                docker buildx build \
                  --target "${{ matrix.target }}" \
                  --tag "ci-${{ matrix.target }}:sha-${{ github.sha }}" \
                  --load .

            - name: Scan Docker image
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  scan-type: image
                  image-ref: ci-${{ matrix.target }}:sha-${{ github.sha }}
                  format: json
                  output: trivy-${{ matrix.target }}.json
                  exit-code: '0'

            - name: Upload scan result
              uses: actions/upload-artifact@v4.6.2
              with:
                name: trivy-${{ matrix.target }}
                path: trivy-${{ matrix.target }}.json
                if-no-files-found: error

      report:
        needs: build_and_scan
        runs-on: ubuntu-24.04
        outputs:
            summary: ${{ steps.report.outputs.summary }}
        steps:
            - name: Download scan results
              uses: actions/download-artifact@v4.3.0
              with:
                  pattern: trivy-*
                  path: trivy-reports
                  merge-multiple: true

            - name: Build scan summary
              id: report
              shell: bash
              run: |
                  summary="$(jq -s '
                    [.[]
                     | .Results[]?.Vulnerabilities[]?] as $v
                    | "### Docker 이미지 취약점 검사\n\n"
                      + "**검사 대상:** `embedding`, `ingest` PR 이미지\n\n"
                      + "| 심각도 | 발견 수 |\n|:--|--:|\n"
                      + "| **CRITICAL** | "
                      + ([$v[] | select(.Severity == "CRITICAL")] | length | tostring)
                      + " |\n| **HIGH** | "
                      + ([$v[] | select(.Severity == "HIGH")] | length | tostring)
                      + " |\n| **MEDIUM** | "
                      + ([$v[] | select(.Severity == "MEDIUM")] | length | tostring)
                      + " |\n| **LOW** | "
                      + ([$v[] | select(.Severity == "LOW")] | length | tostring)
                      + " |"
                      + (if ($v | length) == 0 then
                           "\n\n취약점이 발견되지 않았습니다."
                         else
                           "\n\n<details>\n<summary>주요 취약점 (최대 10건)</summary>\n\n"
                           + "| 심각도 | CVE | 패키지 | 설치 버전 | 수정 버전 |\n"
                           + "|:--|:--|:--|:--|:--|\n"
                           + ([$v | sort_by(
                                 if .Severity == "CRITICAL" then 0
                                 elif .Severity == "HIGH" then 1
                                 elif .Severity == "MEDIUM" then 2
                                 else 3
                                 end
                               ) | .[:10][]
                               | "| `" + (.Severity // "UNKNOWN") + "` | `"
                                + (.VulnerabilityID // "unknown") + "` | `"
                                + (.PkgName // "unknown") + "` | `"
                                + (.InstalledVersion // "version unknown") + "` | `"
                                + (.FixedVersion // "수정 버전 없음") + "` |"]
                              | join("\n"))
                            + "\n\n</details>"
                         end)
                  ' trivy-reports/trivy-embedding.json trivy-reports/trivy-ingest.json)"
                  delimiter="trivy_$(openssl rand -hex 16)"
                  {
                    printf 'summary<<%s\n' "$delimiter"
                    printf '%s\n' "$summary"
                    printf '%s\n' "$delimiter"
                  } >> "$GITHUB_OUTPUT"